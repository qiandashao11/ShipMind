services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shipmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipmind}
      POSTGRES_DB: ${POSTGRES_DB:-shipmind}
    ports:
      - "5432:5432"
    volumes:
      - shipmind_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipmind} -d ${POSTGRES_DB:-shipmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shipmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - optional

  # Milvus standalone with embedded etcd and local storage: a single container,
  # no separate etcd or MinIO services needed.
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: shipmind-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - shipmind_milvus_data:/var/lib/milvus
      - ./docker/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./docker/milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  shipmind_postgres_data:
  shipmind_milvus_data:
